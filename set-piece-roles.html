<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawks — Set-Piece Roles</title>
<link rel="icon" href="assets/crest.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8E2B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hawks">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/site.js" data-page="set-piece-roles" data-eyebrow="Set pieces" data-h1="Set-Piece Roles" data-l2="Every Position, Every Restart" data-sub="Each position's job at every dead ball: our goal kicks, their goal kicks, corners and throw-ins. The detail for each restart is on its own tab."></script>

<section>
  <div class="wrap">
    <p class="tag">Quick reference</p>
    <h2>Your job at every restart</h2>
    <p class="sec-note">Find your position. All five restarts on one card. The detail for each is on its own page.</p>
    <p class="sec-note">Showing the <b id="fl"></b>.</p>
    <div class="pos-grid" id="grid"></div>
  </div>
</section>

<script>
(function(){
  /* Positions in each formation, and each position's job at every restart.
     Agreed at the coaches' meeting; the detail and diagrams are on each restart's own page. */
  var RESTARTS = [
    ["ourGK", "Our goal kicks", "goal-kicks.html#ours"],
    ["theirGK", "Their goal kicks", "goal-kicks.html#theirs"],
    ["attCorner", "Attacking corners", "corners.html#attack"],
    ["defCorner", "Defending corners", "corners.html#defend"],
    ["throw", "Our throw-ins", "throw-ins.html"]
  ];
  var POS = {
    f341: [["GK","Goalkeeper","Our spare player"],["CB","Centre Backs","LCB, CB & RCB"],["W","Wingers","LW & RW"],["CM","Centre Midfielders","LCM & RCM"],["ST","Striker","Up front on her own"]],
    f242: [["GK","Goalkeeper","Our spare player"],["CB","Centre Backs","LCB & RCB"],["WB","Wing Backs","LWB & RWB"],["CM","Centre Midfielders","LCM & RCM"],["10","The 10","Between their lines"],["9","The 9","Leads the line"]]
  };
  var JOBS = {
    f341: {
      GK: { ourGK: "Take it. First choice wide to a winger, second a centre mid, then long. Go long if they press with two or man-mark.",
            theirGK: "Stay alert behind the press. Talk to your back three.",
            attCorner: "Stay in goal. One centre back stays back with you.",
            defCorner: "In the middle of your goal. Centre backs are on the posts.",
            throw: "Stay in goal and talk." },
      CB: { ourGK: "Split wide and give the keeper options.",
            theirGK: "Hold the line. Long ball: deal with it with the centre mids, no heading.",
            attCorner: "Two go to the edge: one arrives late for the low one, one waits just outside the box. The middle centre back stays on halfway.",
            defCorner: "One on each post. The middle centre back guards the space in front of the six-yard box.",
            throw: "The nearest centre back stays behind the ball as safety." },
      W:  { ourGK: "Get wide on the touchline: you're the keeper's first choice. Take it and play it down the line.",
            theirGK: "Nearest winger squeezes up with the striker when we press.",
            attCorner: "Left winger: near post. Right winger: far post.",
            defCorner: "Near side: guard the near-post zone and step out to the short corner. Far side: guard the far zone.",
            throw: "You take the throw on your side. Forward first, if not, keep it." },
      CM: { ourGK: "Show in the middle: you're the keeper's second choice. Nearest one makes the run down the line.",
            theirGK: "Long ball: deal with it with the centre backs, no heading.",
            attCorner: "One takes it (on rotation). The other attacks the centre of the box.",
            defCorner: "One in the six-yard box, ready to step to the near post. The other on the edge of the box.",
            throw: "Nearest one shows short to keep it. The other stays behind the ball as safety." },
      ST: { ourGK: "Stay high and stretch them.",
            theirGK: "Lead the press with the nearest winger. Go when they pass to a centre back, take a bad touch or face their own goal.",
            attCorner: "Stand in front of their keeper.",
            defCorner: "Stay up on halfway, far side, as the outlet.",
            throw: "Run down the line for the throw forward." }
    },
    f242: {
      GK: { ourGK: "Take it. First choice wide to a wing back, second a centre mid, then long. Go long if they press with two or man-mark.",
            theirGK: "Stay alert behind the press. Talk to your centre backs.",
            attCorner: "Stay in goal. One centre back stays back with you.",
            defCorner: "In the middle of your goal. Centre backs are on the posts.",
            throw: "Stay in goal and talk." },
      CB: { ourGK: "Split wide and give the keeper options.",
            theirGK: "Hold the line. Long ball: deal with it with the centre mids, no heading.",
            attCorner: "One arrives late from the edge for the low one. The other stays back.",
            defCorner: "One on each post.",
            throw: "The nearest centre back stays behind the ball as safety." },
      WB: { ourGK: "Get wide on the touchline: you're the keeper's first choice. Take it and play it down the line.",
            theirGK: "Hold your position in the line of four.",
            attCorner: "Left wing back: near post. Right wing back: far post.",
            defCorner: "Near side: guard the near-post zone and step out to the short corner. Far side: guard the far zone.",
            throw: "You take the throw on your side. Forward first, if not, keep it." },
      CM: { ourGK: "Show in the middle: you're the keeper's second choice.",
            theirGK: "Long ball: deal with it with the centre backs, no heading.",
            attCorner: "One takes it (on rotation). The other attacks the centre of the box.",
            defCorner: "One in the six-yard box, the other guarding the space in front of it.",
            throw: "One stays behind the ball as safety." },
      "10": { ourGK: "Make the run down the line when the wing back gets it.",
            theirGK: "Stay on your side. When the 9 forces it wide, press the wide centre back. Don't cross with the 9.",
            attCorner: "Attack the centre of the box.",
            defCorner: "On the edge of the box.",
            throw: "Show short so we can keep it." },
      "9": { ourGK: "Stay high and stretch them.",
            theirGK: "Close down their middle centre back, curve your run to force it wide, then block the pass back to the middle.",
            attCorner: "Stand in front of their keeper.",
            defCorner: "Stay up on halfway, far side, as the outlet.",
            throw: "Run down the line for the throw forward." }
    }
  };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function render(){
    var k = Hawks.form();
    document.getElementById("fl").textContent = Hawks.FORMS[k].label;
    document.getElementById("grid").innerHTML = POS[k].map(function(p, i){
      var jobs = JOBS[k][p[0]] || {};
      return '<div class="pos"><div class="pos-hd"><span class="pos-badge' + (i ? ' dark' : '') + '">' + esc(p[0]) + '</span><span><b>' + esc(p[1]) + '</b><small>' + esc(p[2]) + '</small></span></div><dl class="sp">' +
        RESTARTS.map(function(r){
          var j = jobs[r[0]];
          return '<dt><a href="' + r[2] + '">' + esc(r[1]) + '</a></dt>' + (j ? '<dd>' + esc(j) + '</dd>' : '<dd class="tbc">To be agreed.</dd>');
        }).join("") + '</dl></div>';
    }).join("");
  }
  render();
  document.addEventListener("hawks:form", render);
})();
</script>
<script src="assets/messages.js"></script>
<script>Hawks.footer();</script>
</body>
</html>
