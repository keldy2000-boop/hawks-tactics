<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Their goal kick, our 2-4-2 against their 3-4-1: when the keeper passes to the middle centre back, the 9 closes her down and curves her run to force the pass wide, then blocks the pass back. The 10 stays on her side and presses the wide centre back.">
<defs>
<marker id="tg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b33a"/></marker>
<marker id="ts" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3c8ea"/></marker>
</defs>
<rect x="-3" y="-4" width="74" height="108" fill="#24603f"/><rect x="0" y="0" width="68" height="100" fill="#2f7a4f"/>
<g fill="#000" opacity=".07"><rect x="0" y="10" width="68" height="10"/><rect x="0" y="30" width="68" height="10"/><rect x="0" y="50" width="68" height="10"/><rect x="0" y="70" width="68" height="10"/><rect x="0" y="90" width="68" height="10"/></g>
<g fill="none" stroke="#f2f5ec" stroke-width=".5"><rect x="0" y="0" width="68" height="100"/><line x1="0" y1="50" x2="68" y2="50"/><circle cx="34" cy="50" r="7"/><rect x="17" y="0" width="34" height="14"/><rect x="26" y="0" width="16" height="5"/><rect x="17" y="86" width="34" height="14"/><rect x="26" y="95" width="16" height="5"/><rect x="29" y="-2.2" width="10" height="2.2"/><rect x="29" y="100" width="10" height="2.2"/></g>
<!-- trigger: their keeper passes to the middle centre back -->
<path d="M34 7.6V12.4" fill="none" stroke="#e8b33a" stroke-width=".8" stroke-dasharray="2 1.4" marker-end="url(#tg)"/>
<!-- the 9 closes her down from the right, curving so the only pass is out wide to the left centre back -->
<path d="M41.5 23Q42 18 38.2 17.2" fill="none" stroke="#b3c8ea" stroke-width=".9" marker-end="url(#ts)"/>
<path d="M30.6 17.6L20 19.4" fill="none" stroke="#e8b33a" stroke-width=".6" stroke-dasharray="1.2 1" marker-end="url(#tg)"/>
<!-- then she curves across to block the pass back; the 10 stays on her side and presses the ball -->
<path d="M38 21.5Q31 24 27.5 21.8" fill="none" stroke="#b3c8ea" stroke-width=".7" stroke-dasharray="1.4 1" marker-end="url(#ts)"/>
<path d="M21.8 32.3L20.6 26" fill="none" stroke="#b3c8ea" stroke-width=".9" marker-end="url(#ts)"/>
<g font-family="Arial,sans-serif" font-weight="800" font-size="2.3" fill="#e6e6ea" text-anchor="middle">
<g transform="translate(34 4)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">GK</text></g>
<g transform="translate(16 20)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">CB</text></g>
<g transform="translate(34 17)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">CB</text></g>
<g transform="translate(52 20)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">CB</text></g>
<g transform="translate(6 34)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">W</text></g>
<g transform="translate(28 32)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">CM</text></g>
<g transform="translate(44 33)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">CM</text></g>
<g transform="translate(62 34)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">W</text></g>
<g transform="translate(34 52)"><circle r="3.3" fill="#3a3a42" stroke="#a2a2ab" stroke-width=".5"/><text y=".85">ST</text></g>
</g>
<circle cx="37.2" cy="6.2" r="1.5" fill="#fff" stroke="#18211c" stroke-width=".4"/>
<g transform="translate(34 82)"><circle r="3.9" fill="#b3c8ea" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#5a1a22">GK</text></g>
<g font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff" text-anchor="middle">
<g transform="translate(24 68)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">CB</text></g>
<g transform="translate(44 68)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">CB</text></g>
<g transform="translate(8 46)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">WB</text></g>
<g transform="translate(26 55)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">CM</text></g>
<g transform="translate(42 55)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">CM</text></g>
<g transform="translate(60 46)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">WB</text></g>
<g transform="translate(22 36)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">10</text></g>
<g transform="translate(40.5 27)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1">9</text></g>
</g>
</svg>
