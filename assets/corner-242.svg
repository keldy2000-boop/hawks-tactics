<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Our attacking corner in the 2-4-2: a centre mid takes it. The 9 stands in front of their keeper, the left wing back runs to the near post, the 10 and the other centre mid attack the centre and the right wing back the far post. One centre back arrives late from the edge for the low ball, and the other stays back.">
<defs>
