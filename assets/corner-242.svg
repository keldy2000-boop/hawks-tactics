<g fill="none" stroke="#f2f5ec" stroke-width=".5"><rect x="0" y="0" width="68" height="100"/><line x1="0" y1="50" x2="68" y2="50"/><circle cx="34" cy="50" r="7"/><rect x="17" y="0" width="34" height="14"/><rect x="26" y="0" width="16" height="5"/><rect x="17" y="86" width="34" height="14"/><rect x="26" y="95" width="16" height="5"/><rect x="29" y="-2.2" width="10" height="2.2"/><rect x="29" y="100" width="10" height="2.2"/></g>
<!-- routine 1: cross into the six-yard box. routine 2: low ball for the late runner -->
<path d="M3 2.6Q20 0 35.3 5" fill="none" stroke="#e8b33a" stroke-width=".9" marker-end="url(#cg)"/>
<path d="M2.6 3.9L17.2 13.2" fill="none" stroke="#e8b33a" stroke-width=".7" stroke-dasharray="1.2 1" marker-end="url(#cg)"/>
<!-- runs -->
<path d="M24.3 9.3L11.3 5.6" fill="none" stroke="#ffffff" stroke-width=".7" stroke-dasharray="1.6 1.2" marker-end="url(#cw)"/>
<path d="M26.1 23L18 14.9" fill="none" stroke="#ffffff" stroke-width=".7" stroke-dasharray="1.6 1.2" marker-end="url(#cw)"/>
