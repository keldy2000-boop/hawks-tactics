<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Our attacking corner in the 3-4-1: a centre mid takes it. The striker stands in front of their keeper, the left winger runs to the near post, the other centre mid attacks the centre and the right winger the far post. One centre back arrives late from the edge for the low ball, another waits just outside the box, and the middle centre back stays back on halfway.">
<defs>
<marker id="cg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b33a"/></marker>
<marker id="cw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
</defs>
