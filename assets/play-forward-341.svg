<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Play forward jobs in our 3-4-1 against an opposition 3-4-1: the striker curves her press on their middle centre back, a centre midfielder overlaps the left winger, the ball is switched to the far winger, and the keeper steps off her line">
<defs>
<marker id="as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3c8ea"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fd38d"/></marker>
</defs>
<rect x="-3" y="-4" width="74" height="108" fill="#24603f"/><rect x="0" y="0" width="68" height="100" fill="#2f7a4f"/>
<g fill="#000" opacity=".07"><rect x="0" y="10" width="68" height="10"/><rect x="0" y="30" width="68" height="10"/><rect x="0" y="50" width="68" height="10"/><rect x="0" y="70" width="68" height="10"/><rect x="0" y="90" width="68" height="10"/></g>
<g fill="none" stroke="#f2f5ec" stroke-width=".5"><rect x="0" y="0" width="68" height="100"/><line x1="0" y1="50" x2="68" y2="50"/><circle cx="34" cy="50" r="7"/><rect x="17" y="0" width="34" height="14"/><rect x="26" y="0" width="16" height="5"/><rect x="17" y="86" width="34" height="14"/><rect x="26" y="95" width="16" height="5"/><rect x="29" y="-2.2" width="10" height="2.2"/><rect x="29" y="100" width="10" height="2.2"/></g>
<!-- opposition 3-4-1 (white), attacking down the page -->
<g font-family="Arial,sans-serif" font-weight="800" font-size="2.3" fill="#1a1a1a" text-anchor="middle">
<g transform="translate(34 5)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">GK</text></g>
<g transform="translate(14 20)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">CB</text></g>
<g transform="translate(34 16)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">CB</text></g>
<g transform="translate(54 20)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">CB</text></g>
<g transform="translate(15 44)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">W</text></g>
<g transform="translate(26 40)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">CM</text></g>
<g transform="translate(42 40)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">CM</text></g>
<g transform="translate(54 42)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">W</text></g>
<g transform="translate(34 70)"><circle r="3.2" fill="#f2f2f0" stroke="#1a1a1a" stroke-width=".45"/><text y=".8">ST</text></g>
</g>
<!-- 1: striker curves her press on their middle CB, blocking the pass out to their left CB -->
<path d="M31 25Q22 23 28.5 18.5" fill="none" stroke="#b3c8ea" stroke-width=".9" marker-end="url(#as)"/>
<!-- 7: centre mid overlaps round the outside of the left winger -->
<path d="M23 59Q1 56 3.5 37" fill="none" stroke="#b3c8ea" stroke-width=".9" marker-end="url(#as)"/>
<!-- 8: switch it to the far winger -->
<path d="M12 50L55.5 49" fill="none" stroke="#ffffff" stroke-width=".7" stroke-dasharray="2 1.5" marker-end="url(#aw)"/>
<!-- 10: keeper steps out -->
<path d="M34 88.5V83" fill="none" stroke="#5fd38d" stroke-width=".9" marker-end="url(#ak)"/>
<g transform="translate(34 93)"><circle r="3.9" fill="#b3c8ea" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#5a1a22">GK</text></g>
<g transform="translate(18 77)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">CB</text></g>
<g transform="translate(34 79)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">CB</text></g>
<g transform="translate(50 77)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">CB</text></g>
<g transform="translate(8 52)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">W</text></g>
<g transform="translate(26 60)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">CM</text></g>
<g transform="translate(42 56)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">CM</text></g>
<g transform="translate(60 47)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">W</text></g>
<g transform="translate(34 28)"><circle r="3.9" fill="#8e2b33" stroke="#fff" stroke-width=".55"/><text y="1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="2.8" fill="#fff">ST</text></g>
</svg>
