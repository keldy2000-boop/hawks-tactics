<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Our kick-off in the 2-4-2: the 9 taps it back to the 10, who plays a high ball into their right-back area down our left. The left wing back sprints onto it, the 9 and the 10 follow up, the right wing back comes infield, the right centre mid runs forward, the left centre mid moves to the centre circle and the centre backs push up.">
