<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -4 74 108" role="img" aria-label="Our kick-off in the 3-4-1: the striker taps it back to the high centre mid, who plays a high ball into their right-back area down our left. Our left winger sprints onto it, the striker and the high centre mid follow up, the right winger comes infield to support, the deep centre mid moves up through the centre circle and the back three push up.">
