<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFC Tickton U12s Hawks tactics board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#eaefe8; --surface:#ffffff; --ink:#18211c; --muted:#56635b; --line:#cdd6cd;
  --brand:#7a1f34; --brand-ink:#ffffff; --chip:#f3e4e8; --gold:#e8b33a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111a15; --surface:#1a2620; --ink:#e9f0eb; --muted:#9fb1a6; --line:#2c3b33;
    --brand:#b04561; --brand-ink:#ffffff; --chip:#33202a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111a15; --surface:#1a2620; --ink:#e9f0eb; --muted:#9fb1a6; --line:#2c3b33;
  --brand:#b04561; --brand-ink:#ffffff; --chip:#33202a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 32px}
h1{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-stretch:118%;font-weight:850;font-size:clamp(22px,5.6vw,38px);line-height:1;margin:0;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted)}
.hd{display:flex;gap:14px;align-items:center}
.crest{width:64px;height:64px;flex:none;border-radius:50%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 10px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;min-height:56px}
.seg b{display:block;font-family:Archivo,Arial,sans-serif;font-stretch:112%;font-weight:800;font-size:22px;line-height:1.1}
.seg span{font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg button[aria-pressed="true"] span{color:var(--brand-ink);opacity:.85}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.aim{margin:4px 0 14px;color:var(--muted)}
.stage{display:block}
.pitchcol{max-width:460px;margin:0 auto}
svg#pitch{display:block;width:100%;height:auto;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.legend .us{background:#8a2139;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.legend .gk{background:#e8b33a;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.legend .them{background:#2b4470;border:2px solid #b9c7e0}
.infocol{margin-top:14px}
.cap{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step{font-size:14px;font-weight:700;color:var(--brand);margin:0 0 4px}
:root[data-theme="dark"] .step{color:#e08aa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step{color:#e08aa0}}
.cap p.t{margin:0;font-size:19px;line-height:1.38;min-height:5.5em}
.dots{display:flex;gap:2px;margin-top:8px}
.dots button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots button[aria-current="step"]::after{background:var(--brand);transform:scale(1.25)}
:root[data-theme="dark"] .dots button[aria-current="step"]::after{background:#e08aa0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dots button[aria-current="step"]::after{background:#e08aa0}}
.tr{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px}
.tr button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.tr button.go{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-size:18px}
.tr button:disabled{opacity:.4;cursor:default}
.spd{margin-top:8px;display:flex;justify-content:flex-end}
.spd button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 4px;min-height:40px}
.roles{margin-top:18px}
.roles h2{font-family:Archivo,Arial,sans-serif;font-stretch:112%;font-weight:800;font-size:20px;margin:0 0 8px}
.roles dl{margin:0;display:grid;gap:8px}
.roles .r{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.roles dt{font-weight:800}
.roles dd{margin:2px 0 0;color:var(--muted)}
.fine{margin-top:22px;font-size:13px;color:var(--muted)}
@media (min-width:860px){
  .wrap{padding-top:28px}
  .stage{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:32px;align-items:start}
  .pitchcol{margin:0;max-width:none}
  .infocol{margin-top:0}
  .seg{max-width:440px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
/* pitch drawing */
.ln{fill:none;stroke:#f2f5ec;stroke-width:.5}
.tp{stroke:#fff;stroke-width:.55;stroke-dasharray:1.3 1.2;opacity:.7;fill:none}
.to{stroke:#b9c7e0;stroke-width:.5;stroke-dasharray:1.3 1.2;opacity:.55;fill:none}
.tb{stroke:#e8b33a;stroke-width:.85;stroke-dasharray:1.6 1.2;fill:none}
.lbl{font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:2.7px;fill:#fff;text-anchor:middle}
.lbl.k{fill:#3a2a00}
</style>
</head>

/* ---------- state ---------- */
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var S={form:"f242",scene:0,step:0,playing:false,slow:false};
var frames=[],cur=null,anim=null,holdAt=null;
var MOVE=1700,HOLD=2300;

var usG=$("#us"),oppG=$("#opp"),trG=$("#trails"),ball=$("#ball");
var P={},O=[];

function resolve(form,scene){
  var pos=JSON.parse(JSON.stringify(form.base));
  var opp=cp(OPP_PRESS),show=false,bs=null,last=[34,50];
  return scene.steps.map(function(s){
    if(s.p){for(var k in s.p){pos[k]=s.p[k].slice();}}
    if("o" in s){
      if(s.o===null){show=false;}
      else{show=true;opp=typeof s.o==="function"?s.o(opp):cp(s.o);}
    }
    if(s.b!==undefined){bs=s.b;}
    var ballN=1,b=last;
    if(bs===null){ballN=0;}
    else if(Array.isArray(bs)){b=bs.slice();}
    else if(/^o\d$/.test(bs)){var q=opp[+bs.charAt(1)];b=[q[0]-3.3,q[1]+2.8];}
    else{b=[pos[bs][0]+3.4,pos[bs][1]-2.6];}
    last=b;
    return {cap:s.c,pos:JSON.parse(JSON.stringify(pos)),opp:cp(opp),showN:show?1:0,ball:b.slice(),ballN:ballN};
  });
}

function lp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function mix(A,B,t){
  var pos={};
  for(var id in B.pos){pos[id]=[lp(A.pos[id][0],B.pos[id][0],t),lp(A.pos[id][1],B.pos[id][1],t)];}
  return {
    pos:pos,
    opp:B.opp.map(function(b,i){return [lp(A.opp[i][0],b[0],t),lp(A.opp[i][1],b[1],t)];}),
    showN:lp(A.showN,B.showN,t),
    ball:[lp(A.ball[0],B.ball[0],t),lp(A.ball[1],B.ball[1],t)],
    ballN:lp(A.ballN,B.ballN,t)
  };
}

function buildPlayers(){
  var f=FORMS[S.form];
  usG.innerHTML="";P={};
  f.ids.forEach(function(id){
    var g=el("g",{},usG),gk=id==="GK";
    el("circle",{r:3.7,fill:gk?"#e8b33a":"#8a2139",stroke:"#fff","stroke-width":.55},g);
    var t=el("text",{y:.95,"class":"lbl"+(gk?" k":"")},g);t.textContent=f.names[id];
    P[id]=g;
  });
  if(!O.length){
    oppG.innerHTML="";
    for(var i=0;i<9;i++){O.push(el("circle",{r:3.3,fill:"#2b4470",stroke:"#b9c7e0","stroke-width":.5},oppG));}
  }
}

function draw(f){
  var form=FORMS[S.form];
  form.ids.forEach(function(id){P[id].setAttribute("transform","translate("+f.pos[id][0].toFixed(2)+" "+f.pos[id][1].toFixed(2)+")");});
  O.forEach(function(c,i){c.setAttribute("cx",f.opp[i][0].toFixed(2));c.setAttribute("cy",f.opp[i][1].toFixed(2));});
  oppG.style.opacity=f.showN;
  ball.setAttribute("cx",f.ball[0].toFixed(2));ball.setAttribute("cy",f.ball[1].toFixed(2));
  ball.style.opacity=f.ballN;
}

function shorten(a,b,r){var dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy);if(d<=r){return b;}return [b[0]-dx/d*r,b[1]-dy/d*r];}
function line(a,b,cls,mk,r){
  var e=shorten(a,b,r);
  el("line",{x1:a[0].toFixed(2),y1:a[1].toFixed(2),x2:e[0].toFixed(2),y2:e[1].toFixed(2),"class":cls,"marker-end":"url(#"+mk+")"},trG);
}
function trails(A,B){
  trG.innerHTML="";
  var form=FORMS[S.form];
  if(A.showN>.5&&B.showN>.5){
    B.opp.forEach(function(b,i){var a=A.opp[i];if(Math.hypot(b[0]-a[0],b[1]-a[1])>3){line(a,b,"to","ab",4.2);}});
  }
  form.ids.forEach(function(id){
    var a=A.pos[id],b=B.pos[id];
    if(Math.hypot(b[0]-a[0],b[1]-a[1])>3){line(a,b,"tp","aw",4.6);}
  });
  if(B.ballN>.5&&Math.hypot(B.ball[0]-A.ball[0],B.ball[1]-A.ball[1])>3){line(A.ball,B.ball,"tb","ag",2.4);}
}

function goTo(i,snap){
  var to=frames[i];
  S.step=i;holdAt=null;
  if(snap||reduce||!cur){
    cur=mix(to,to,0);anim=null;trG.innerHTML="";draw(cur);
  }else{
    anim={from:cur,to:to,t0:null,dur:MOVE*(S.slow?1.6:1)};
    trails(cur,to);
  }
  ui();
}

function tick(ts){
  if(anim){
    if(anim.t0===null){anim.t0=ts;}
    var k=Math.min(1,(ts-anim.t0)/anim.dur);
    cur=mix(anim.from,anim.to,ease(k));draw(cur);
    if(k>=1){cur=mix(anim.to,anim.to,0);anim=null;holdAt=ts;}
  }else if(S.playing){
    if(holdAt===null){holdAt=ts;}
    var hold=(reduce?3200:HOLD)*(S.slow?1.6:1);
    if(ts-holdAt>hold){
      if(S.step<frames.length-1){goTo(S.step+1);}
      else{goTo(0,true);}
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- UI ---------- */
function ui(){
  var form=FORMS[S.form],sc=form.scenes[S.scene];
  $("#aim").textContent=sc.aim;
  $("#stepLbl").textContent="Step "+(S.step+1)+" of "+frames.length;
  $("#capTxt").textContent=frames[S.step].cap;
  var d=$("#dots");d.innerHTML="";
  frames.forEach(function(_,i){
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Go to step "+(i+1));
    if(i===S.step){b.setAttribute("aria-current","step");}
    b.addEventListener("click",function(){goTo(i);});
    d.appendChild(b);
  });
  $("#bPlay").textContent=S.playing?"Pause":"Play";
  $("#bBack").disabled=S.step===0;
  $("#bNext").disabled=S.step===frames.length-1;
  $("#bSpd").textContent="Speed: "+(S.slow?"slow":"normal");
}

function renderPickers(){
  var fb=$("#forms");fb.innerHTML="";
  Object.keys(FORMS).forEach(function(k){
    var b=document.createElement("button");b.type="button";
    b.setAttribute("aria-pressed",k===S.form?"true":"false");
    b.innerHTML="<b>"+FORMS[k].label+"</b><span>"+FORMS[k].tag+"</span>";
    b.addEventListener("click",function(){if(S.form!==k){S.form=k;S.scene=Math.min(S.scene,FORMS[k].scenes.length-1);loadScene(true);}});
    fb.appendChild(b);
  });
  var tb=$("#tabs");tb.innerHTML="";
  FORMS[S.form].scenes.forEach(function(sc,i){
    var b=document.createElement("button");b.type="button";b.textContent=sc.name;
    b.setAttribute("aria-pressed",i===S.scene?"true":"false");
    b.addEventListener("click",function(){S.scene=i;loadScene(false);});
    tb.appendChild(b);
  });
  var form=FORMS[S.form],r=$("#roles");
  var h="<h2>Who does what in the "+form.label+"</h2><dl>";
  form.roles.forEach(function(x){h+="<div class=\"r\"><dt>"+x[0]+"</dt><dd>"+x[1]+"</dd></div>";});
  r.innerHTML=h+"</dl>";
}

function loadScene(rebuild){
  var form=FORMS[S.form];
  if(rebuild){buildPlayers();}
  frames=resolve(form,form.scenes[S.scene]);
  cur=null;renderPickers();goTo(0,true);
}

$("#bPlay").addEventListener("click",function(){
  S.playing=!S.playing;
  if(S.playing&&S.step===frames.length-1&&!anim){goTo(0,true);}
  holdAt=null;ui();
});
$("#bNext").addEventListener("click",function(){if(S.step<frames.length-1){goTo(S.step+1);}});
$("#bBack").addEventListener("click",function(){if(S.step>0){goTo(S.step-1);}});
$("#bSpd").addEventListener("click",function(){S.slow=!S.slow;ui();});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"&&S.step<frames.length-1){goTo(S.step+1);}
  else if(e.key==="ArrowLeft"&&S.step>0){goTo(S.step-1);}
  else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();$("#bPlay").click();}
});

buildPlayers();
loadScene(false);
requestAnimationFrame(tick);
})();
</script>
